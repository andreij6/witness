[package]
name = "witness-pages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
local-dev = []

[dependencies]
witness-canister-common = { workspace = true }
witness-format = { workspace = true }
candid = { workspace = true }
