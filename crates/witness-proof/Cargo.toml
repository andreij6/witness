[package]
name = "witness-proof"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
registry = ["dep:witness-canister-common"]
testkit = ["dep:ic_bls12_381", "dep:sha2"]

[dependencies]
witness-format.workspace = true
witness-merkle.workspace = true
witness-canister-common = { workspace = true, optional = true }
ic-certification = { workspace = true }
ic-verify-bls-signature = { version = "0.6.0", default-features = false, features = ["alloc"] }
serde_cbor = "0.11.2"
serde_bytes = { workspace = true }
ic_bls12_381 = { version = "0.10.1", default-features = false, features = ["groups", "pairings", "alloc", "experimental"], optional = true }
sha2 = { version = "0.10.9", default-features = false, optional = true }

[dev-dependencies]
witness-proof = { path = ".", features = ["testkit"] }
ic_bls12_381 = { version = "0.10.1", default-features = false, features = ["groups", "pairings", "alloc", "experimental"] }
sha2 = { version = "0.10.9", default-features = false }
serde_json = "1.0.154"
hex = "0.4.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
witness-proof = { path = ".", features = ["testkit", "registry"] }
