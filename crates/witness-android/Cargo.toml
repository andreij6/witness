[package]
name = "witness-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "witness_android"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
trustmark = ["dep:ort"]
bindgen = ["uniffi/cli"]

[dependencies]
witness-core = { workspace = true }
witness-canister-common = { workspace = true }
witness-proof = { workspace = true, features = ["registry"] }
candid = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
uniffi = "=0.32.2"
thiserror = "2"
url = "2"
ic-agent = { version = "=0.45.0", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"], optional = true }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
witness-verdict = { workspace = true, features = ["testkit"] }
witness-proof = { workspace = true, features = ["registry", "testkit"] }
serde_json = "1.0.154"
hex = "0.4.3"
