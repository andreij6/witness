[package]
name = "witness-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testkit = ["dep:witness-verdict", "witness-verdict/testkit", "witness-proof/testkit"]

[dependencies]
witness-core.workspace = true
witness-verdict = { workspace = true, optional = true }
witness-proof.workspace = true
wasm-bindgen = "=0.2.130"
serde = { workspace = true }
serde_json = "1.0.154"
hex = "0.4.3"
base64 = "0.22.1"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }

[dev-dependencies]
witness-web = { path = ".", features = ["testkit"] }
witness-verdict = { workspace = true, features = ["testkit"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
witness-registry = { path = "../../canisters/registry" }
witness-canister-common = { workspace = true }
candid = { workspace = true }
pocket-ic = { workspace = true }
ic-certification = { workspace = true }
serde_cbor = "0.11.2"
serde_bytes = { workspace = true }

[[example]]
name = "fixture"
required-features = ["testkit"]
